# @package _global_

defaults:
  - train
  - override /task: libero_uncond_2cam224_1e-4
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false
  save_videos: true
  retry_invalid_episodes: false
  max_invalid_episode_retries: 20
  black_screen_filter: false
  black_screen_mean_threshold: 5.0
  black_screen_std_threshold: 2.0
  black_screen_min_frame_fraction: 0.8

  # Action inference
  # Keep static routing as the default so legacy wo/w evaluations preserve
  # their exact dispatch behavior. Gate/random routing makes one decision per
  # action-chunk query and executes only the selected endpoint.
  routing_mode: static  # static | gate | random
  use_manifest_text_cache: false
  inference_mode: wo
  gate_checkpoint: null
  gate_checkpoint_sha256: null
  gate_threshold: null
  gate_expected_label_manifest_sha256: null
  gate_expected_episode_split_assignment_sha256: null
  gate_expected_training_config_sha256: null
  gate_expected_git_commit: null
  gate_expected_git_tracked_dirty: false
  gate_expected_git_untracked_source_files: []
  # Formal Gate evaluation pins one COMPLETE receipt and selects a published
  # target rate. The evaluator derives the threshold and all Gate identities;
  # direct gate_* fields above remain available only for connectivity smokes.
  gate_calibration_complete: null
  gate_calibration_complete_sha256: null
  gate_calibration_target_with_rate: null
  random_video_probability: 0.5
  random_seed: 42
  timing_enabled: true
  timing_warmup_queries: 3
  save_query_metrics: true
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

  # Optional Stage 3 endpoint artifact. `ckpt` remains the frozen base.
  # When stage3_adapter_path is set, Adapter SHA is mandatory; base/data
  # identities default to the selected Stage 3 task contract.
  stage3_adapter_path: null
  stage3_adapter_sha256: null
  # Formal Phase-A launcher supplies the frozen external simulator identity.
  simulator_runtime_identity_sha256: null
  stage3_base_sha256: null
  stage3_data_manifest_sha256: null
  stage3_training_contract_sha256: null
  stage3_global_step: null

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8
  max_tasks_per_gpu: 2

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
