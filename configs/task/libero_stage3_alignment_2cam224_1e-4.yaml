# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_unified_aligned
  - _self_

output_dir: ./runs/stage3_alignment/libero_2cam224/${now:%Y-%m-%d}_${now:%H-%M-%S}

base:
  checkpoint: ${oc.env:FASTWAM_STAGE3_BASE_CHECKPOINT,/root/feihong/FastWAM/formal_runs/FAST_WAM_github/libero_unified_shared_2cam224_1e-4/2026-07-01_00-44-20/checkpoints/weights/latest.pt}
  expected_sha256: ${oc.env:FASTWAM_STAGE3_BASE_SHA256,17a5588cc2b8d162219c9daf818614f614ee4a7921933a4a26c5d678111330e9}

assets:
  vae:
    path: ${oc.env:FASTWAM_STAGE3_VAE,/root/feihong/FastWAM/checkpoints/Wan-AI/Wan2.2-TI2V-5B/Wan2.2_VAE.pth}
    expected_sha256: 20eb789667fa5e60e7516bf509512f6cb61f01b0aa0695eadaea930c13892b36
  normalization_stats:
    path: ${data.train.pretrained_norm_stats}
    expected_sha256: 30f81ad7d5076e97323e3328bce003e01a04cb21327b5bacd21bb72846768638

data:
  train:
    pretrained_norm_stats: ${oc.env:FASTWAM_LIBERO_STATS,/root/feihong/FastWAM/formal_runs/FAST_WAM_github/libero_unified_shared_2cam224_1e-4/2026-07-01_00-44-20/dataset_stats.json}
    video_backend: torchcodec
    strict_data_mode: true

model:
  skip_dit_load_from_pretrain: true
  redirect_common_files: false
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: null

runtime:
  # The 2026-07-01 base run used 277713 frames / 1712 episodes. The current
  # local dataset is smaller, so the formal launcher intentionally fails until
  # the original data is restored or this contract is explicitly revised.
  expected_dataset_length: ${oc.env:FASTWAM_STAGE3_EXPECTED_DATASET_LENGTH,277713}
  expected_dataset_episodes: ${oc.env:FASTWAM_STAGE3_EXPECTED_DATASET_EPISODES,1712}
  required_environment:
    DIFFSYNTH_MODEL_BASE_PATH: /root/feihong/FastWAM/checkpoints
    DIFFSYNTH_SKIP_DOWNLOAD: "true"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"

hydra:
  job:
    env_set:
      DIFFSYNTH_MODEL_BASE_PATH: /root/feihong/FastWAM/checkpoints
      DIFFSYNTH_SKIP_DOWNLOAD: "true"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
