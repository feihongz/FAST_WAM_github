# @package _global_

defaults:
  - override /data: robotwin_1of5
  - override /model: fastwam_unified_two_action
  - _self_

# dataloading
batch_size: 16
num_workers: 8

model:
  mot_checkpoint_mixed_attn: false

# scheduler -- preserve the full-data training settings; five epochs now contain
# roughly one fifth as many optimizer steps.
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 5
max_steps: null
log_every: 10
save_every: 1000
eval_every: 500

# training
gradient_accumulation_steps: 1
weight_decay: 1e-2
resume: null
